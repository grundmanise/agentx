name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check is a Makefile target, so CI and `make check` run the same commands.
jobs:
  lint:
    name: CLI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make fmt-check
      - run: make lint
      - run: make tidy-check

  test:
    name: CLI test (${{ matrix.os }})
    # Linux and macOS: the serve watcher has a backend per platform, and the
    # macOS one (FSEvents, cgo) only compiles there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make build
      # The race detector runs on Linux only. The macOS job is there for the
      # watcher's FSEvents backend; the Linux job finds the data races, and
      # `make check` keeps -race locally.
      - run: make test ${{ runner.os == 'macOS' && 'RACE=' || '' }}
        if: runner.os != 'macOS'
      # TEMPORARY: time every test on macOS to see what dominates there.
      - if: runner.os == 'macOS'
        working-directory: apps/cli
        env:
          GORACE: atexit_sleep_ms=0
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string || true
          git --version
          echo "200 git --version from a shell:"; time (for i in $(seq 200); do git --version > /dev/null; done)
          echo "200 /usr/bin/true from a shell:"; time (for i in $(seq 200); do /usr/bin/true; done)
          set +e
          go test -count=1 -timeout 30m -json ./... > "$RUNNER_TEMP/test.json"
          status=$?
          python3 ../../.github/ci-slowest.py "$RUNNER_TEMP/test.json"
          exit $status
