name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check is a Makefile target, so CI and `make check` run the same commands.
# `make check` runs `check-cli` and `check-desktop`; the CLI jobs split `check-cli` into its steps.
jobs:
  lint:
    name: CLI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make fmt-check-cli
      - run: make lint-cli
      - run: make tidy-check-cli

  test:
    name: CLI test (${{ matrix.os }})
    # Linux and macOS: the serve watcher has a backend per platform, and the
    # macOS one (FSEvents, cgo) only compiles there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make build-cli
      # The race detector runs on Linux only. The macOS job is there for the
      # watcher's FSEvents backend; the Linux job finds the data races, and
      # `make check-cli` keeps -race locally.
      - run: make test-cli ${{ runner.os == 'macOS' && 'RACE=' || '' }}

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: make check-desktop
