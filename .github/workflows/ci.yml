name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check is a Makefile target, so CI and `make check` run the same commands.
jobs:
  lint:
    name: CLI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make fmt-check
      - run: make lint
      - run: make tidy-check

  test-shard:
    name: CLI test shard (${{ matrix.os }}, ${{ matrix.shard }}/3)
    # Linux and macOS: the serve watcher has a backend per platform, and the
    # macOS one (FSEvents, cgo) only compiles there. Three parts per system
    # run in parallel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make build
      - run: make test-shard SHARD=${{ matrix.shard }} SHARDS=3

  # The checks main requires. A matrix job has one result for all its parts,
  # so each of these fails when any part on either system did not succeed;
  # the shard jobs show which.
  test:
    name: CLI test (${{ matrix.os }})
    needs: test-shard
    if: always()
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "$RESULT" = success ] || { echo "the test parts ended with: $RESULT"; exit 1; }'
        env:
          RESULT: ${{ needs.test-shard.result }}
