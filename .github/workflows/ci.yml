name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every check is a Makefile target, so CI and `make check` run the same commands.
jobs:
  lint:
    name: CLI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make fmt-check
      - run: make lint
      - run: make tidy-check

  test:
    name: CLI test (${{ matrix.os }})
    # Linux and macOS: the serve watcher has a backend per platform, and the
    # macOS one (FSEvents, cgo) only compiles there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - run: make build
      # The race detector runs on Linux only. The macOS job is there for the
      # watcher's FSEvents backend; the Linux job finds the data races, and
      # `make check` keeps -race locally.
      - run: make test ${{ runner.os == 'macOS' && 'RACE=' || '' }}
        if: runner.os != 'macOS'
      # TEMPORARY: time the CLI tests on one macOS runner with the temporary
      # directory on disk and on a RAM disk, at several parallelisms.
      - if: runner.os == 'macOS'
        working-directory: apps/cli
        run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          dev=$(hdiutil attach -nomount ram://4194304 | awk '{print $1}')
          diskutil erasevolume APFS ramdisk "$dev" > /dev/null
          mkdir -p /Volumes/ramdisk/tmp
          go test -count=1 ./internal/gitx ./internal/home ./internal/interrupt ./internal/lineage ./internal/mcp ./internal/scan ./internal/serve ./internal/source ./internal/treeid ./internal/vercel
          go test -c -o "$RUNNER_TEMP/cli.test" ./internal/cli
          cd internal/cli
          failed=0
          for run in disk:8 ram:8 disk:12 ram:12 ram:16 disk:8; do
            where=${run%%:*}; n=${run##*:}
            tmp=$TMPDIR; [ "$where" = ram ] && tmp=/Volumes/ramdisk/tmp
            start=$(date +%s)
            if TMPDIR=$tmp "$RUNNER_TEMP/cli.test" -test.count=1 -test.timeout=30m -test.parallel=$n > "$RUNNER_TEMP/$where-$n.log" 2>&1; then status=ok; else status=FAIL; failed=1; fi
            echo "$where parallel=$n: $(( $(date +%s) - start )) s $status"
            [ $status = ok ] || grep -E -- "--- FAIL|panic" "$RUNNER_TEMP/$where-$n.log" | head -20
          done
          exit $failed
